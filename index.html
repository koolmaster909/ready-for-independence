<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Ready for Independence</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="RFI" />
<meta name="format-detection" content="telephone=no,date=no,address=no,email=no" />
<meta name="theme-color" content="#0B1F3A" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230B1F3A'/%3E%3Ctext x='50' y='66' font-size='54' text-anchor='middle'%3E%F0%9F%8E%93%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B1F3A;
  --navy-2:#132A4D;
  --paper:#F5F3EE;
  --card:#FFFFFF;
  --ink:#101828;
  --ink-soft:#5B6472;
  --line:#E7E3D9;
  --amber:#E68A2E;
  --amber-deep:#C96A16;
  --teal:#1C8C7C;
  --coral:#D6553F;
  --gold:#C99A2E;
  --ok:#1C8C7C;
  --warn:#C96A16;
  --danger:#C0392B;
  --r-sm:8px;
  --r-md:14px;
  --r-lg:22px;
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 6px 18px rgba(16,24,40,.06);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none;}
body{
  font-family:'Manrope',system-ui,-apple-system,sans-serif;
  background:var(--navy);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  position:fixed;
  inset:0;
  width:100%;
}
#root{height:100%;}
h1,h2,h3,h4,.font-display{font-family:'Sora',system-ui,sans-serif;}
button{font-family:inherit;}
.app-shell{
  max-width:460px;
  margin:0 auto;
  height:100%;
  background:var(--paper);
  position:relative;
  display:flex;
  flex-direction:column;
  box-shadow:0 0 60px rgba(0,0,0,.35);
  overflow:hidden;
}
.screen{
  flex:1;
  padding:18px 16px 96px;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior-y:contain;
}
.topbar{
  position:sticky;
  top:0;
  z-index:20;
  background:var(--navy);
  color:#fff;
  padding:calc(14px + env(safe-area-inset-top)) 16px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:3px solid var(--amber);
  flex-shrink:0;
}
.topbar .brand{
  display:flex;
  align-items:center;
  gap:8px;
  font-family:'Sora',sans-serif;
  font-weight:700;
  font-size:15px;
  letter-spacing:.2px;
}
.topbar .brand .flag{
  width:22px;height:22px;border-radius:6px;
  background:linear-gradient(135deg,var(--amber),var(--coral));
  display:flex;align-items:center;justify-content:center;font-size:12px;
}
.mode-toggle{
  font-size:11px;
  font-weight:700;
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.25);
  color:#fff;
  padding:6px 10px;
  border-radius:20px;
  cursor:pointer;
  letter-spacing:.3px;
}
.mode-toggle.parent-active{background:var(--amber);border-color:var(--amber);color:var(--navy);}
.topbar-actions{display:flex;gap:6px;align-items:center;flex-shrink:0;}
.topbar .brand span.bt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px;}
.lang-toggle{padding:6px 9px;font-size:11px;}

/* Bottom nav */
.bottomnav{
  position:sticky;
  bottom:0;
  z-index:20;
  background:var(--navy);
  display:flex;
  justify-content:space-around;
  padding:8px 4px calc(8px + env(safe-area-inset-bottom));
  border-top:1px solid rgba(255,255,255,.08);
  flex-shrink:0;
}
.install-tip{
  background:var(--amber);
  color:#fff;
  font-size:11.5px;
  font-weight:700;
  text-align:center;
  padding:8px 14px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  flex-shrink:0;
}
.install-tip button{
  background:rgba(255,255,255,.25);
  border:none;color:#fff;border-radius:6px;padding:3px 8px;font-size:11px;font-weight:800;cursor:pointer;
}
.navbtn{
  background:none;border:none;color:rgba(255,255,255,.55);
  display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10px;font-weight:700;letter-spacing:.2px;
  padding:6px 8px;border-radius:10px;cursor:pointer;
  flex:1;
}
.navbtn .ic{font-size:19px;}
.navbtn.active{color:var(--amber);}

/* Cards */
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--r-md);
  padding:16px;
  margin-bottom:14px;
  box-shadow:var(--shadow);
}
.card-flush{padding:0;overflow:hidden;}
.section-title{
  font-family:'Sora',sans-serif;
  font-size:13px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.6px;
  color:var(--ink-soft);
  margin:22px 0 10px;
}
.section-title:first-child{margin-top:0;}

/* Home header */
.hero-banner{
  background:linear-gradient(160deg,var(--navy),var(--navy-2));
  border-radius:var(--r-lg);
  padding:18px 16px 16px;
  margin-bottom:16px;
}
.hello{color:#fff;margin-bottom:14px;}
.hello h1{font-size:21px;margin:2px 0 2px;color:#fff;}
.hello .sub{font-size:13px;color:rgba(255,255,255,.78);}

.stat-row{display:flex;gap:10px;margin-bottom:4px;}
.stat-chip{
  flex:1;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.16);
  border-radius:var(--r-sm);
  padding:10px 10px;
  color:#fff;
}
.stat-chip .n{font-family:'Sora',sans-serif;font-weight:800;font-size:17px;}
.stat-chip .l{font-size:10px;color:rgba(255,255,255,.75);text-transform:uppercase;letter-spacing:.4px;}

/* Score ring */
.score-wrap{display:flex;align-items:center;gap:16px;}
.ring{
  width:92px;height:92px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  background:conic-gradient(var(--teal) calc(var(--pct)*1%), #EDEAE0 0);
  position:relative;
}
.ring::before{
  content:'';position:absolute;width:70px;height:70px;border-radius:50%;background:#fff;
}
.ring .val{position:relative;font-family:'Sora',sans-serif;font-weight:800;font-size:22px;color:var(--navy);}
.ring .val small{display:block;font-size:9px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;}

.xpbar-track{
  height:8px;background:#EDEAE0;border-radius:20px;overflow:hidden;margin-top:6px;
}
.xpbar-fill{height:100%;background:linear-gradient(90deg,var(--amber),var(--gold));border-radius:20px;}

.badge-pill{
  display:inline-flex;align-items:center;gap:5px;
  background:var(--navy-2);color:#fff;font-size:11px;font-weight:700;
  padding:5px 10px;border-radius:20px;
}

/* Category grid */
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.cat-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);
  padding:13px;cursor:pointer;box-shadow:var(--shadow);position:relative;
  border-left:4px solid var(--cat-color,var(--teal));
}
.cat-card .ic{font-size:22px;}
.cat-card .name{font-size:12.5px;font-weight:700;margin-top:6px;line-height:1.25;color:var(--ink);}
.cat-card .prog{font-size:10px;color:var(--ink-soft);margin-top:6px;}
.cat-card .tag{
  position:absolute;top:10px;right:10px;font-size:9px;font-weight:800;color:var(--ink-soft);
  background:var(--paper);padding:2px 6px;border-radius:6px;
}
.mini-track{height:5px;background:#EDEAE0;border-radius:8px;margin-top:5px;overflow:hidden;}
.mini-fill{height:100%;background:var(--cat-color,var(--teal));}

/* Lesson rows */
.lesson-row{
  display:flex;align-items:center;gap:12px;
  padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer;
}
.lesson-row:last-child{border-bottom:none;}
.lstatus{
  width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:14px;flex-shrink:0;font-weight:800;
}
.lstatus.completed{background:var(--teal);color:#fff;}
.lstatus.pending{background:var(--amber);color:#fff;}
.lstatus.available{background:#EDEAE0;color:var(--ink-soft);}
.lesson-row .lt{flex:1;}
.lesson-row .lt .t{font-weight:700;font-size:13.5px;}
.lesson-row .lt .x{font-size:11px;color:var(--ink-soft);margin-top:2px;}
.chev{color:var(--ink-soft);font-size:16px;}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:none;border-radius:var(--r-sm);padding:12px 18px;font-weight:700;font-size:13.5px;cursor:pointer;
  width:100%;
}
.btn-primary{background:var(--amber);color:#fff;}
.btn-primary:active{background:var(--amber-deep);}
.btn-outline{background:transparent;border:1.5px solid var(--navy);color:var(--navy);}
.btn-ghost{background:var(--paper);color:var(--ink);border:1px solid var(--line);}
.btn-sm{padding:8px 12px;font-size:12px;width:auto;}
.btn-danger-o{background:transparent;border:1.5px solid var(--danger);color:var(--danger);}
.btn:disabled{opacity:.45;cursor:not-allowed;}

/* Lesson detail */
.backbtn{background:none;border:none;color:var(--navy);font-weight:700;font-size:13px;display:flex;align-items:center;gap:4px;cursor:pointer;padding:4px 0 14px;}
.lesson-hero{background:var(--navy);color:#fff;border-radius:var(--r-md);padding:18px;margin-bottom:16px;}
.lesson-hero .k{font-size:11px;color:var(--amber);font-weight:800;text-transform:uppercase;letter-spacing:.5px;}
.lesson-hero h2{margin:6px 0 4px;font-size:19px;}
.lesson-hero .xp{font-size:12px;color:rgba(255,255,255,.7);}
.block-title{font-weight:800;font-size:12.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--amber-deep);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.steps{margin:0;padding:0;list-style:none;}
.steps li{
  display:flex;gap:10px;padding:8px 0;font-size:13.5px;line-height:1.45;border-bottom:1px dashed var(--line);
}
.steps li:last-child{border-bottom:none;}
.steps .num{
  width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;font-size:11px;font-weight:800;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;
}
.ex-box{background:#FBF6EA;border:1px solid #EFD9A8;border-radius:var(--r-sm);padding:12px;font-size:13px;line-height:1.5;}
.chk-item{display:flex;align-items:flex-start;gap:10px;padding:9px 0;font-size:13.5px;border-bottom:1px solid var(--line);cursor:pointer;}
.chk-item:last-child{border-bottom:none;}
.chk-box{width:20px;height:20px;border-radius:6px;border:2px solid var(--ink-soft);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;margin-top:1px;}
.chk-box.done{background:var(--teal);border-color:var(--teal);}
.chk-item.done .t{text-decoration:line-through;color:var(--ink-soft);}

/* Missions */
.mission-card{border-radius:var(--r-md);padding:14px;margin-bottom:12px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);}
.mission-card .top{display:flex;justify-content:space-between;align-items:flex-start;}
.mission-card .name{font-weight:700;font-size:13.5px;}
.mission-card .desc{font-size:12px;color:var(--ink-soft);margin-top:3px;}
.mission-xp{font-size:11px;font-weight:800;color:var(--amber-deep);white-space:nowrap;}

.badge-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.badge-tile{
  aspect-ratio:1;border-radius:var(--r-md);display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--card);border:1px solid var(--line);font-size:22px;gap:4px;text-align:center;padding:4px;
}
.badge-tile.locked{opacity:.32;filter:grayscale(1);}
.badge-tile .bn{font-size:8.5px;font-weight:700;line-height:1.15;}

/* Chat */
.chat-scroll{display:flex;flex-direction:column;gap:10px;padding-bottom:8px;}
.bubble{max-width:82%;padding:10px 13px;border-radius:16px;font-size:13.5px;line-height:1.45;}
.bubble.coach{background:var(--navy);color:#fff;border-bottom-left-radius:4px;align-self:flex-start;}
.bubble.me{background:var(--amber);color:#fff;border-bottom-right-radius:4px;align-self:flex-end;}
.chip-row{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px;}
.chip{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:7px 12px;font-size:11.5px;font-weight:700;cursor:pointer;color:var(--navy);}
.chatbar{display:flex;gap:8px;position:sticky;bottom:0;background:var(--paper);padding-top:8px;}
.chatbar input{flex:1;border:1.5px solid var(--line);border-radius:20px;padding:11px 14px;font-size:13.5px;font-family:inherit;}
.chatbar button{width:42px;height:42px;border-radius:50%;background:var(--amber);color:#fff;border:none;font-size:16px;cursor:pointer;flex-shrink:0;}

/* Roadmap */
.timeline{position:relative;padding-left:22px;}
.timeline::before{content:'';position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tl-item{position:relative;padding-bottom:20px;}
.tl-dot{position:absolute;left:-22px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--teal);border:3px solid #fff;box-shadow:0 0 0 2px var(--teal);}
.tl-dot.now{background:var(--amber);box-shadow:0 0 0 2px var(--amber);}
.tl-dot.future{background:var(--line);box-shadow:0 0 0 2px var(--line);}
.tl-item .when{font-size:10.5px;font-weight:800;color:var(--ink-soft);text-transform:uppercase;}
.tl-item .what{font-size:13.5px;font-weight:700;margin:2px 0 3px;}
.tl-item .detail{font-size:12px;color:var(--ink-soft);line-height:1.4;}

/* Parent dashboard */
.pbar-row{margin-bottom:12px;}
.pbar-row .lbl{display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:4px;}
.pbar-row .lbl span:last-child{color:var(--ink-soft);font-weight:600;}
.ptrack{height:8px;background:#EDEAE0;border-radius:20px;overflow:hidden;}
.pfill{height:100%;border-radius:20px;}

.verify-row{border:1px solid var(--line);border-radius:var(--r-sm);padding:11px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
.verify-row .vt{font-weight:700;font-size:13px;}
.verify-row .vs{font-size:11px;color:var(--ink-soft);}
.vbtns{display:flex;gap:6px;}
.iconbtn{width:34px;height:34px;border-radius:8px;border:none;font-size:15px;cursor:pointer;}
.iconbtn.ok{background:var(--teal);color:#fff;}
.iconbtn.no{background:#F3E4E1;color:var(--danger);}

.formfield{margin-bottom:12px;}
.formfield label{display:block;font-size:11.5px;font-weight:700;color:var(--ink-soft);margin-bottom:5px;text-transform:uppercase;letter-spacing:.3px;}
.formfield select, .formfield input, .formfield textarea{
  width:100%;border:1.5px solid var(--line);border-radius:var(--r-sm);padding:10px 11px;font-size:13.5px;font-family:inherit;background:#fff;
}

.toast{
  position:fixed;left:50%;bottom:96px;transform:translateX(-50%);
  background:var(--navy);color:#fff;padding:12px 18px;border-radius:20px;font-size:13px;font-weight:700;
  box-shadow:0 8px 24px rgba(0,0,0,.3);z-index:100;display:flex;align-items:center;gap:8px;
  max-width:88%;text-align:center;
  animation:toastIn .25s ease-out;
}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px);}to{opacity:1;transform:translate(-50%,0);}}

.empty{text-align:center;padding:30px 10px;color:var(--ink-soft);font-size:13px;}
.pill-year{display:inline-block;font-size:10px;font-weight:800;padding:3px 8px;border-radius:6px;background:var(--navy);color:#fff;margin-bottom:8px;}

::-webkit-scrollbar{width:0;height:0;}
</style>

    challenge:'Tự đặt lịch và đi cắt tóc hoàn toàn một mình, kể cả việc thanh toán/tip.',
    checklist:['Đã chuẩn bị bộ sản phẩm chăm sóc da','Ghi lại chuỗi 2 tuần duy trì thói quen','Tự đặt lịch và hoàn thành việc cắt tóc']}},
  lau1:{vi:{title:'Tự Giặt Đồ',
    why:'Làm hỏng một chiếc áo hoodie 60 đô vì giặt lẫn màu là bài học mà bạn có thể tránh được. Quần áo sạch = sự tự tin và sức khỏe.',
    steps:['Phân loại theo màu (đồ tối/đồ sáng/đồ mỏng manh) và độ dày vải.','Đọc ký hiệu trên nhãn quần áo trước khi giặt bất cứ món đồ mới nào.','Chọn đúng lượng bột giặt và chế độ/nhiệt độ giặt.','Chạy máy giặt, rồi chuyển đồ sang máy sấy ngay để tránh mùi ẩm mốc.','Sấy đúng mức nhiệt; phơi khô tự nhiên với đồ mỏng manh.','Gấp hoặc treo đồ ngay — đừng để đồ nằm mãi trong giỏ.'],
    example:'Áo đỏ + tất trắng giặt nước nóng = tất hồng vĩnh viễn. Giặt nước lạnh + tách riêng màu sẽ tránh được lỗi kinh điển này.',
    practice:'Tự hoàn thành một chu trình giặt đầy đủ: giặt, sấy, gấp, cất đồ.',
    challenge:'Hoàn thành 3 chu trình giặt đầy đủ trong 3 tuần khác nhau mà không cần ai giúp.',
    checklist:['Phân loại đồ đúng cách','Đọc to nhãn hướng dẫn giặt/giải thích được nội dung','Hoàn thành chu trình giặt+sấy+gấp+cất đồ','Lặp lại một mình trong 3 tuần liên tiếp']}},
  lau2:{vi:{title:'Ủi & Gấp Đồ Như Chuyên Gia',
    why:'Phỏng vấn xin học, thuyết trình ở trường, và ấn tượng đầu tiên cần một chiếc áo không bị nhăn nhúm.',
    steps:['Chỉnh nhiệt độ bàn ủi phù hợp với loại vải (kiểm tra nhãn).','Ủi áo sơ mi có cổ: cổ áo, vai, tay áo, thân áo.','Học cách gấp áo thun 30 giây và gấp quần.','Biết mẹo không cần ủi: treo trong phòng tắm có hơi nước.'],
    example:'Một chiếc áo phẳng phiu khi phỏng vấn ở trường thể hiện sự nghiêm túc trước cả khi bạn nói lời nào.',
    practice:'Ủi một chiếc áo sơ mi có cổ và gấp toàn bộ một ngăn tủ quần áo.',
    challenge:'Chuẩn bị sẵn cả bộ trang phục (đã ủi + gấp) từ tối hôm trước cho một ngày quan trọng, không cần ai nhắc.',
    checklist:['Ủi được áo mà không làm cháy vải','Áp dụng cách gấp 30 giây','Chuẩn bị trang phục từ tối hôm trước ít nhất một lần']}},
  cook1:{vi:{title:'5 Món Ăn Bạn Luôn Có Thể Nấu',
    why:'Đồ ăn căng-tin sẽ nhanh chán, và đồ ăn ngoài tốn kém với ngân sách sinh viên. Năm món ăn đáng tin cậy = bạn không bao giờ đói hay cháy túi.',
    steps:['Thành thạo trứng theo 3 cách (chiên khuấy, chiên trứng ốp, trứng cuộn).','Học cách xào một chảo với cơm.','Học cách nấu mì Ý + sốt đóng hũ + đạm.','Học cách nướng gà + rau củ trên khay.','Học cách nấu súp đơn giản hoặc bát ngũ cốc/rau củ.'],
    example:'Một mẻ xào 6 đô làm được 3 bữa ăn — rẻ và lành mạnh hơn một lần đặt đồ ăn giao tận nơi.',
    practice:'Nấu từng món trong 5 món một lần, từ nguyên liệu tươi, không mở video hướng dẫn.',
    challenge:'Nấu đủ bữa tối cho cả tuần (5 tối) cho chính mình, từ danh sách đi chợ do bạn tự lập.',
    checklist:['Đã nấu cả 5 món cơ bản ít nhất một lần','Có thể kể tên 3 món mà không cần công thức','Hoàn thành một tuần nấu ăn tối tự lên kế hoạch']}},
  cook2:{vi:{title:'An Toàn Bếp & Dọn Dẹp',
    why:'Cháy, ngộ độc thực phẩm, và bếp chung bừa bộn đều có thể tránh được với 4-5 thói quen.',
    steps:['Biết các nguyên tắc an toàn khi dùng dao và nhiệt độ nấu an toàn.','Không bao giờ rời khỏi bếp/lò khi đang nấu.','Dọn dẹp trong lúc nấu — không để dồn thành một đống sau cùng.','Bảo quản đồ ăn thừa an toàn và biết khi nào nên bỏ đi.'],
    example:'Gà chưa chín kỹ là lỗi phổ biến nhất của người mới — luôn kiểm tra thịt không còn màu hồng và nước chảy ra trong.',
    practice:'Nấu một bữa ăn đầy đủ và dọn bếp sạch sẽ trong vòng 10 phút sau khi nấu xong.',
    challenge:"Tổ chức một buổi 'nấu cho ai đó' — mời bạn bè hoặc người thân và tự dọn dẹp một mình.",
    checklist:['Giải thích được nhiệt độ an toàn cho thịt gà/bò','Nấu ăn không để lại bừa bộn','Đã mời người khác ăn và tự dọn dẹp']}},
  gro1:{vi:{title:'Lên Kế Hoạch & Đi Chợ Cho Cả Tuần',
    why:'Đi chợ khi đói bụng mà không có danh sách là cách sinh viên tiêu 80 đô vào đồ ăn vặt mà vẫn chẳng có gì để nấu tối.',
    steps:['Lên kế hoạch bữa ăn cho cả tuần trước khi đi chợ.','Viết danh sách theo từng khu vực trong siêu thị.','Đặt ngân sách trước khi bước vào cửa hàng.','Mua ở khu vực bên ngoài trước (rau củ, sữa, thịt), rồi mới đến các dãy kệ.'],
    example:'Danh sách 35 đô có kế hoạch nuôi bạn cả tuần; một chuyến đi chợ không kế hoạch thường tốn hơn mà vẫn thiếu đồ.',
    practice:'Lên kế hoạch và thực hiện một tuần đi chợ đầy đủ trong ngân sách đã đặt.',
    challenge:'Đi chợ liên tục 2 tuần, theo dõi chi tiêu thực tế so với ngân sách.',
    checklist:['Lên kế hoạch bữa ăn trước khi đi chợ','Bám sát danh sách đã viết','Đạt ngân sách 2 tuần liên tiếp']}},
  gro2:{vi:{title:'Đọc Nhãn & So Sánh Giá',
    why:'Hàng thương hiệu không phải lúc nào cũng tốt hơn, và nhãn dinh dưỡng giúp bạn ăn uống lành mạnh với ngân sách hạn hẹp.',
    steps:['So sánh giá trên mỗi đơn vị, không chỉ giá trên nhãn.','Kiểm tra nhãn dinh dưỡng về đạm/đường/muối.','Biết sự khác biệt giữa hàng nhãn riêng của siêu thị và hàng thương hiệu.',"Nhận ra khi nào 'giảm giá' thực ra không phải là ưu đãi tốt."],
    example:"Hộp lớn hơn với giá trên đơn vị cao hơn là một cái bẫy phổ biến — luôn kiểm tra nhãn giá 'trên mỗi ounce' trên kệ.",
    practice:'So sánh 5 món hàng theo giá trên đơn vị và chọn lựa chọn thông minh hơn mỗi lần.',
    challenge:'Giảm 15% chi tiêu chợ hằng tuần chỉ bằng cách so sánh nhãn/giá.',
    checklist:['Giải thích được cách tính giá trên đơn vị','Đọc đúng 5 nhãn dinh dưỡng','Giảm được 15% chi tiêu trong một tuần']}},
  bud1:{vi:{title:'Lập Ngân Sách Tháng Đầu Tiên',
    why:'Tiền sẽ hết rất nhanh khi không ai để ý. Một ngân sách đơn giản nghĩa là bạn quyết định tiền đi đâu, thay vì bất ngờ khi nó biến mất.',
    steps:['Liệt kê tất cả nguồn thu nhập (trợ cấp, việc làm, quà tặng).','Liệt kê chi phí cố định (điện thoại, gói đăng ký) và chi phí biến đổi (ăn uống, giải trí).','Áp dụng quy tắc 50/30/20 làm khởi điểm: nhu cầu/mong muốn/tiết kiệm.','Theo dõi chi tiêu trong 2 tuần và so sánh với kế hoạch.'],
    example:'Trợ cấp 200 đô/tháng chia theo 50/30/20 = 100 đô nhu cầu, 60 đô mong muốn, 40 đô tiết kiệm — tự động, không cần đoán.',
    practice:'Lập một ngân sách thật trong bảng tính hoặc ứng dụng ghi chú với số liệu thực tế của bạn.',
    challenge:'Theo dõi từng đô la chi tiêu trong một tháng đầy đủ so với ngân sách.',
    checklist:['Đã lập ngân sách với số liệu thực tế','Hoàn thành theo dõi 2 tuần','Theo dõi cả tháng với sai lệch dưới 10%']}},
  bud2:{vi:{title:'Khung Quyết Định: Nhu Cầu vs Mong Muốn',
    why:"Mỗi lần mua sắm là một sự đánh đổi. Biết phân biệt nhu cầu và mong muốn giúp tránh những khoảnh khắc 'tiền của mình đi đâu rồi'.",
    steps:['Định nghĩa nhu cầu (ăn uống, đi lại, thiết yếu) so với mong muốn (trò chơi, ăn ngoài).','Áp dụng quy tắc chờ 24 giờ trước khi mua đồ không thiết yếu trên 20 đô.','Tự hỏi: điều này giúp mình tiến gần mục tiêu hay chỉ cảm thấy vui trong một ngày?'],
    example:'Chờ 24 giờ trước khi mua giày mới sẽ loại bỏ được một nửa các quyết định mua sắm bốc đồng.',
    practice:'Áp dụng quy tắc 24 giờ cho 3 quyết định mua sắm thực tế trong tháng này.',
    challenge:'Trải qua trọn một tháng không mua sắm bốc đồng nào trên 20 đô.',
    checklist:['Phân loại đúng 10 món đồ mẫu vào nhu cầu/mong muốn','Áp dụng quy tắc 24 giờ 3 lần','Duy trì một tháng không mua sắm bốc đồng']}},
  bank1:{vi:{title:'Mở & Quản Lý Tài Khoản Ngân Hàng Mỹ',
    why:'Bạn sẽ cần tài khoản thanh toán ở Mỹ cho tiền thuê nhà, ăn uống, và cuộc sống hằng ngày — và biết cách thực sự đọc hiểu nó.',
    steps:['Hiểu sự khác biệt giữa tài khoản thanh toán và tài khoản tiết kiệm.','Học cách đọc sao kê ngân hàng và phát hiện sai sót.','Thiết lập gửi séc qua điện thoại và chuyển khoản.','Hiểu phí thấu chi và cách tránh nó.'],
    example:"Một lần phí thấu chi có thể lên tới 35 đô — biết số dư thực (không phải 'số dư khả dụng') sẽ giúp tránh điều này.",
    practice:'Xem một sao kê ngân hàng mẫu và xác định đúng 5 loại giao dịch.',
    challenge:'Quản lý một tài khoản thật hoặc tài khoản thực hành trong một tháng không phát sinh phí nào.',
    checklist:['Giải thích được tài khoản thanh toán vs tiết kiệm','Đọc đúng sao kê','Hoàn thành một tháng không phí']}},
  bank2:{vi:{title:'Thẻ, Ứng Dụng & Tránh Lừa Đảo',
    why:'Thẻ ghi nợ, Venmo/Zelle, và lừa đảo qua tin nhắn là thực tế hằng ngày — một cú chạm sai có thể tốn tiền thật.',
    steps:['Biết sự khác biệt giữa thẻ ghi nợ và thẻ tín dụng, và khi nào dùng loại nào.','Thiết lập Venmo/Zelle/Cash App một cách an toàn.','Học cách nhận biết tin nhắn/email lừa đảo yêu cầu mã hoặc thông tin đăng nhập.','Biết phải làm gì ngay khi thẻ bị mất hoặc bị lộ thông tin.'],
    example:"Một tin nhắn nói 'ngân hàng của bạn cần xác minh' kèm đường link hầu như luôn là lừa đảo — ngân hàng không hỏi theo cách đó.",
    practice:"Xác định đúng 5 ví dụ 'cảnh báo ngân hàng' thật và giả.",
    challenge:'Thiết lập và sử dụng an toàn một ứng dụng thanh toán ngang hàng cho một giao dịch thật.',
    checklist:['Nhận diện đúng cả 5 ví dụ lừa đảo','Thiết lập ứng dụng với mã PIN/sinh trắc học bảo mật','Giải thích được kế hoạch xử lý khi mất thẻ']}},
  time1:{vi:{title:'Lập Lịch Trình Hằng Tuần',
    why:"Sẽ không có phụ huynh nào đánh thức bạn dậy hay nhắc bạn học bài. Lịch của bạn trở thành 'phụ huynh' của chính bạn.",
    steps:['Sắp xếp giờ học/lớp trước, rồi đến việc nhà, rồi đến thời gian giao lưu.','Dùng một ứng dụng lịch cho tất cả mọi thứ — không dùng giấy nhớ rải rác.','Xem lại và làm mới lịch mỗi Chủ nhật.','Dành thời gian dự phòng cho những việc bất ngờ.'],
    example:"Đặt lịch 'giặt đồ 9-10 giờ tối' như một cuộc hẹn thật sẽ khiến nó thực sự xảy ra.",
    practice:'Lập và tuân theo một lịch trình tuần đầy đủ trong 7 ngày.',
    challenge:'Tự vận hành lịch trình của mình trong 3 tuần liên tiếp mà không bỏ lỡ cam kết nào.',
    checklist:['Lập lịch tuần trong một ứng dụng','Tuân theo trong 7 ngày','Chuỗi 3 tuần không bỏ lỡ việc nào']}},
  time2:{vi:{title:'Hệ Thống Đánh Bại Trì Hoãn',
    why:'Deadline chồng chất rất nhanh ở một đất nước mới khi không ai kiểm tra bài tập của bạn.',
    steps:['Chia nhỏ việc lớn thành các khối tập trung 25 phút (Pomodoro).','Làm việc khó nhất trước, không để đến cuối.','Loại bỏ xao nhãng từ điện thoại trong lúc tập trung.','Tự thưởng cho bản thân sau khi hoàn thành, không phải trước.'],
    example:"'Bài luận 3 trang' nghe có vẻ bất khả thi; 'một đoạn văn, 25 phút' nghe khả thi — và đó là cùng một việc.",
    practice:'Áp dụng phương pháp Pomodoro cho 5 buổi học.',
    challenge:'Hoàn thành một bài tập thật trước hạn chót 2 ngày tròn.',
    checklist:['Ghi lại 5 buổi Pomodoro','Giải thích được nguyên tắc làm việc khó nhất trước','Hoàn thành một việc sớm 2 ngày']}},
  aca1:{vi:{title:'Theo Dõi Bài Tập & Hạn Chót',
    why:'Trường học ở Mỹ mong đợi bạn tự theo dõi — sẽ không ai gọi về nhà báo bài tập bị thiếu như một số trường khác.',
    steps:['Thiết lập một công cụ theo dõi duy nhất: ứng dụng lịch hoặc sổ tay, không dùng cả hai.','Ghi lại mọi bài tập ngay ngày được giao, kèm hạn nộp.','Kiểm tra công cụ theo dõi mỗi ngày, cùng một giờ.','Đánh dấu bất cứ việc gì đến hạn trong 48 giờ tới.'],
    example:'Tuần đầu học kỳ (syllabus week) là lúc hầu hết các hạn chót bị bỏ lỡ bắt đầu — ghi lại mọi thứ ngay ngày đầu tiên.',
    practice:'Theo dõi một tuần bài tập thật trên tất cả các môn học.',
    challenge:'Trải qua trọn một kỳ chấm điểm không bỏ lỡ hạn chót nào.',
    checklist:['Đã thiết lập công cụ theo dõi','Ghi chép chính xác một tuần đầy đủ','Không bỏ lỡ hạn chót nào trong một học kỳ']}},
  aca2:{vi:{title:'Hệ Thống Học Tập Hiệu Quả',
    why:"'Học một lúc' không phải là một hệ thống — gợi nhớ chủ động và giãn cách ôn tập mới thực sự hiệu quả.",
    steps:['Dùng gợi nhớ chủ động (tự kiểm tra) thay vì đọc lại ghi chú.','Giãn cách các buổi ôn tập qua nhiều ngày, không nhồi nhét một đêm.','Tìm một chỗ học không bị xao nhãng trong khuôn viên trường.','Hỏi giáo viên/trợ giảng khi bí, đừng chỉ đoán.'],
    example:'Đọc lại một chương cảm giác như hiệu quả nhưng kết quả kiểm tra lại kém hơn so với gấp sách lại và tự kiểm tra.',
    practice:'Dùng gợi nhớ chủ động để ôn cho một bài kiểm tra thật.',
    challenge:'Áp dụng ôn tập giãn cách suốt một tuần trước một bài kiểm tra lớn — và theo dõi kết quả điểm số.',
    checklist:['Giải thích được gợi nhớ chủ động vs đọc lại','Áp dụng cho một bài kiểm tra thật','Chủ động hỏi giáo viên một câu hỏi làm rõ']}},
  tra1:{vi:{title:'Đọc Bản Đồ & Ứng Dụng Giao Thông Công Cộng',
    why:'Không có tài xế gia đình ở Mỹ — xe buýt, tàu điện, và ứng dụng đặt xe là cách bạn di chuyển khắp nơi.',
    steps:['Cài đặt và thiết lập một ứng dụng giao thông (Google/Apple Maps hoặc ứng dụng địa phương).','Học cách đọc bản đồ tuyến đường và điểm chuyển tuyến.','Hiểu về thẻ/vé và cách nạp tiền.','Lên kế hoạch chuyến đi với tuyến dự phòng phòng khi trễ.'],
    example:'Lỡ một chuyến xe buýt không nên làm hỏng cả ngày của bạn — luôn biết giờ khởi hành tiếp theo.',
    practice:'Lên kế hoạch một tuyến đi thật có nhiều điểm dừng bằng ứng dụng.',
    challenge:'Tự đi phương tiện công cộng đến một nơi mới, một mình, không cần trợ giúp.',
    checklist:['Đã thiết lập ứng dụng giao thông','Lên kế hoạch tuyến đi có phương án dự phòng','Hoàn thành một chuyến đi tuyến mới một mình']}},
  tra2:{vi:{title:'Tự Tin Di Chuyển Một Mình',
    why:'Di chuyển một mình ở một thành phố lạ cần sự tinh ý, không chỉ cần chỉ đường.',
    steps:['Ngồi gần tài xế hoặc ở toa đông người vào giờ vắng.','Giữ đồ có giá trị không lộ ra ngoài; biết điểm dừng của mình trước khi lên xe.','Biết phải làm gì nếu lỡ điểm dừng hoặc bị lạc.','Lưu số liên lạc khẩn cấp và bản đồ ngoại tuyến cho khu vực không có sóng.'],
    example:'Tải bản đồ ngoại tuyến trước chuyến đi sẽ cứu bạn khi điện thoại mất sóng dưới lòng đất.',
    practice:'Đi phương tiện công cộng vào giờ đông và giờ vắng, ghi nhận sự khác biệt trong cách xử lý.',
    challenge:'Xử lý một tình huống đổi tuyến ngoài kế hoạch (lỡ điểm dừng, trễ chuyến) và tự khắc phục mà không hoảng loạn hay gọi về nhà trước.',
    checklist:['Thể hiện được thói quen an toàn','Đã lưu bản đồ ngoại tuyến','Tự xử lý được một tình huống đổi tuyến thật']}},
  trv1:{vi:{title:'Đóng Gói & Chuẩn Bị Cho Chuyến Bay',
    why:'Bạn sẽ bay quốc tế một mình — sai sót khi đóng gói và chuẩn bị có thể tốn kém hoặc gây căng thẳng.',
    steps:['Kiểm tra giới hạn cân nặng/kích thước hành lý trước khi đóng gói.','Đóng gói hành lý xách tay thông minh: giấy tờ, sạc, một bộ quần áo thay.','Check-in online và chụp/in vé lên máy bay.','Nắm chắc yêu cầu về hộ chiếu/visa.'],
    example:'Hành lý xách tay có bộ quần áo thay sẽ cứu bạn nếu hành lý ký gửi bị trễ.',
    practice:'Đóng gói đầy đủ hành lý xách tay + hành lý ký gửi trong giới hạn của hãng bay cho một chuyến đi thử.',
    challenge:'Tự hoàn thành toàn bộ khâu chuẩn bị trước chuyến bay thật (check-in, giấy tờ, đóng gói) một mình.',
    checklist:['Đóng gói trong giới hạn cân nặng/kích thước','Tự check-in độc lập','Kiểm tra đầy đủ giấy tờ trước ngày đi']}},
  trv2:{vi:{title:'Tự Di Chuyển Trong Sân Bay',
    why:'Sân bay lớn ở Mỹ gây rối ngay cả trong ngày bình thường — bạn cần một hệ thống bình tĩnh, không phải may mắn.',
    steps:['Đến sớm với thời gian dự phòng hợp lý (2-3 giờ cho chuyến quốc tế).','Nắm rõ quy trình an ninh: chất lỏng, laptop, quy định giày dép.','Đọc bảng chỉ dẫn cổng/nhà ga và thông báo từ ứng dụng khi có thay đổi.','Biết phải làm gì nếu chuyến bay trễ hoặc đổi cổng.'],
    example:'Đổi cổng 30 phút trước khi lên máy bay là chuyện bình thường — hãy kiểm tra bảng thông báo, đừng chỉ tin vào vé ban đầu.',
    practice:'Đi qua một kịch bản mô phỏng cả ngày ở sân bay và xác định từng bước.',
    challenge:'Tự di chuyển hoàn toàn độc lập cho một chuyến bay thật (nội địa hoặc quốc tế).',
    checklist:['Giải thích đúng quy trình chuẩn bị an ninh','Xử lý được tình huống mô phỏng đổi cổng','Hoàn thành một chuyến bay thật một mình']}},
  dorm1:{vi:{title:'Sắp Xếp Phòng Ký Túc Xá',
    why:'Phòng của bạn là căn cứ hoạt động — sắp xếp gọn gàng ngay từ đầu nghĩa là bớt căng thẳng cả năm.',
    steps:['Lập danh sách kiểm tra khi chuyển vào (chăn ga, đồ lưu trữ, dụng cụ cơ bản).','Thiết lập lịch dọn dẹp cho không gian nhỏ.','Nắm rõ quy định của tòa nhà (giờ yên tĩnh, khách, an toàn cháy nổ).','Học cách xử lý sự cố cơ bản: khởi động lại wifi, cầu dao điện, yêu cầu bảo trì.'],
    example:'Gửi yêu cầu bảo trì đúng cách (không phải nhắn tin nhờ bạn bè sửa) giúp việc được xử lý nhanh.',
    practice:'Sắp xếp và duy trì một không gian gọn gàng trong 2 tuần.',
    challenge:'Gửi một yêu cầu bảo trì/cơ sở vật chất thật và theo dõi đến khi được xử lý.',
    checklist:['Hoàn thành danh sách kiểm tra khi chuyển vào','Tuân theo lịch dọn dẹp 2 tuần','Xử lý được một vấn đề bảo trì thật']}},
  dorm2:{vi:{title:'Sống Chung Với Bạn Cùng Phòng',
    why:'Chia sẻ không gian với người lạ là một trong những nguồn căng thẳng lớn nhất của sinh viên — và là kỹ năng bạn có thể luyện tập ngay bây giờ.',
    steps:['Thống nhất kỳ vọng chung ngay từ đầu (việc nhà, khách, tiếng ồn, giờ yên tĩnh).','Luyện tập trò chuyện trực tiếp, bình tĩnh khi có mâu thuẫn, không dùng ghi chú mỉa mai.','Chia đều chi phí và việc nhà chung, có theo dõi.','Biết khi nào nên nhờ RA/người hòa giải thay vì tự xử lý.'],
    example:"'Này, chúng ta thống nhất giờ yên tĩnh sau 11 giờ nhé?' tốt hơn nhiều so với âm thầm bực bội cả tháng.",
    practice:'Có một cuộc trò chuyện thật kiểu bạn cùng phòng (với anh chị em, bạn bè, hoặc phụ huynh đóng vai) về kỳ vọng chung.',
    challenge:'Giải quyết một bất đồng thật về không gian chung một cách bình tĩnh và trực tiếp.',
    checklist:['Đã luyện tập cuộc trò chuyện thiết lập ranh giới','Chia đều một chi phí/việc nhà chung','Giải quyết một mâu thuẫn thật mà không leo thang']}},
  hea1:{vi:{title:'Đặt Lịch & Đi Khám Bác Sĩ',
    why:'Không có phụ huynh gọi phòng khám giúp — bạn cần tự mô tả triệu chứng và quản lý việc chăm sóc của mình.',
    steps:['Biết thông tin thẻ bảo hiểm và cách tìm bác sĩ trong mạng lưới.','Gọi/đặt lịch hẹn và mô tả triệu chứng rõ ràng.','Nắm rõ tiền sử bệnh: dị ứng, thuốc đang dùng, bệnh trước đây.','Đặt câu hỏi và hiểu rõ hướng dẫn trước khi ra về.'],
    example:"'Đau' thôi là chưa đủ — 'đau nhói, bên phải phía dưới, bắt đầu 2 ngày trước' giúp bạn được chăm sóc tốt hơn.",
    practice:'Đóng vai đặt lịch hẹn và mô tả một triệu chứng rõ ràng.',
    challenge:'Tự đặt lịch và đi khám thật (khám tổng quát, nha sĩ, v.v.) tự quản lý toàn bộ giao tiếp.',
    checklist:['Ghi nhớ/lưu thông tin bảo hiểm','Hoàn thành đóng vai luyện tập','Tự quản lý một buổi khám thật']}},
  hea2:{vi:{title:'Xử Lý Bệnh Nhẹ Hoặc Chấn Thương Nhỏ',
    why:'Cảm lạnh, vết cắt, hay đau bụng không nên trở thành khủng hoảng khi bạn ở một mình.',
    steps:['Chuẩn bị sẵn bộ sơ cứu + thuốc cơ bản.','Biết liều dùng thuốc không kê đơn an toàn và khi nào nên đi khám thay vì nghỉ ngơi.',"Biết ranh giới giữa phòng khám cấp cứu vs phòng cấp cứu vs 'chỉ cần nghỉ ngơi'.",'Lưu sẵn số khẩn cấp và thông tin trung tâm y tế sinh viên.'],
    example:"Sốt 101°F kèm nghỉ ngơi và uống nước khác với sốt 104°F — biết ranh giới nào nghĩa là 'cần giúp đỡ ngay'.",
    practice:'Chuẩn bị một bộ sơ cứu và giải thích khi nào dùng từng món.',
    challenge:'Tự xử lý trọn vẹn một tình huống bệnh nhẹ/chấn thương nhỏ thật với quyết định tự chăm sóc đúng đắn.',
    checklist:['Đã chuẩn bị và giải thích được bộ dụng cụ','Vượt qua bài kiểm tra quyết định tình huống','Tự xử lý đúng một tình huống thật']}},
  soc1:{vi:{title:'Trò Chuyện Xã Giao & Kết Bạn',
    why:'Trường mới, đất nước mới, không có sẵn nhóm bạn — kỹ năng xã hội là cách nhanh nhất để cảm thấy như ở nhà.',
    steps:['Học 5 câu mở đầu trò chuyện dễ dàng với người mới.','Luyện tập lắng nghe chủ động: hỏi thêm, không chỉ chờ đến lượt mình nói.','Tham gia một câu lạc bộ/hoạt động trong tháng đầu để nhanh chóng gặp gỡ mọi người.','Chủ động liên lạc lại với người bạn đã gặp — rủ rê, đừng chỉ chờ đợi.'],
    example:"'Điều gì khiến bạn chọn trường này?' mở ra một cuộc trò chuyện thật hơn nhiều so với chỉ nói 'chào'.",
    practice:'Bắt chuyện với 3 người mới trong tuần này và ghi lại điều gì hiệu quả.',
    challenge:'Tham gia một câu lạc bộ hoặc hoạt động nhóm và tham dự 3 buổi.',
    checklist:['Dùng 3 câu mở đầu với người thật','Tham gia một hoạt động','Tham dự 3 buổi']}},
  soc2:{vi:{title:'Tự Tin Nhờ Giúp Đỡ',
    why:'Quá tự ái để nhờ giúp đỡ là nguyên nhân số 1 khiến du học sinh cô lập.',
    steps:['Xác định nên hỏi ai: giáo viên, RA, cố vấn, bạn cùng lớp.',"Luyện tập cách hỏi rõ ràng, cụ thể (không mơ hồ kiểu 'em đang gặp khó khăn').",'Theo dõi lại bằng một lời cảm ơn — điều này xây dựng mối quan hệ.','Biết rằng việc hỏi là bình thường và được khuyến khích; văn hóa Mỹ đánh giá cao điều đó.'],
    example:"'Thầy/cô có thể giải thích rõ hơn câu 3 không ạ? Em không chắc câu này hỏi gì' sẽ nhận được câu trả lời nhanh và hữu ích.",
    practice:'Hỏi một câu hỏi thật, cụ thể với giáo viên hoặc cố vấn trong tuần này.',
    challenge:"Nhờ giúp đỡ về một điều mà bình thường bạn sẽ tránh hỏi (học tập, xã hội, hoặc hậu cần).",
    checklist:['Xác định đúng người nên hỏi 3 lần','Đặt một câu hỏi cụ thể',"Hoàn thành một việc từng 'né tránh'"]}},
  saf1:{vi:{title:'Danh Bạ Khẩn Cấp & Kế Hoạch Ứng Phó',
    why:'Trong tình huống khẩn cấp, bạn sẽ không có thời gian để suy nghĩ — kế hoạch phải đã có sẵn.',
    steps:['Lưu số liên lạc khẩn cấp (ICE) trên màn hình khóa điện thoại.','Biết số an ninh/khẩn cấp của trường, không chỉ số 911.','Chia sẻ vị trí với người tin cậy khi di chuyển.','Biết kế hoạch phòng cháy chữa cháy và sơ tán của ký túc xá/tòa nhà.'],
    example:'Thông tin y tế trên màn hình khóa giúp nhân viên cấp cứu biết dị ứng của bạn ngay cả khi điện thoại đang khóa.',
    practice:'Thiết lập số liên lạc khẩn cấp và ID y tế trên điện thoại.',
    challenge:'Tự đi thử tuyến đường sơ tán và tính thời gian.',
    checklist:['Đã thiết lập số liên lạc khẩn cấp','Đã thiết lập chia sẻ vị trí','Đã đi thử và tính thời gian tuyến sơ tán']}},
  saf2:{vi:{title:'Xử Lý Bị Khóa Ngoài, Lừa Đảo, Hoặc Tai Nạn',
    why:'Những sự cố nhỏ này cuối cùng sẽ xảy ra với ai cũng vậy — hoảng loạn khiến mọi thứ tệ hơn, có kế hoạch khiến nó trở thành chuyện nhỏ.',
    steps:['Biết nên gọi ai khi bị khóa ngoài (RA, chủ nhà, thợ khóa).','Nhận diện các trò lừa đảo phổ biến nhắm vào sinh viên (giả danh quan chức, ưu đãi quá tốt để tin).','Biết các bước cơ bản khi có tai nạn: an toàn trước, rồi ghi lại, rồi báo cáo.','Luôn có sẵn một quỹ khẩn cấp nhỏ cho đúng những lúc thế này.'],
    example:"Người gọi tự xưng là 'cơ quan di trú' đòi thanh toán bằng thẻ quà tặng luôn luôn là lừa đảo — cúp máy, tự xác minh độc lập.",
    practice:'Đóng vai 2 tình huống lừa đảo và nhận diện đúng các dấu hiệu cảnh báo.',
    challenge:'Tự xử lý một sự cố nhỏ thật (bị khóa ngoài, mất đồ, v.v.) theo kế hoạch mà không hoảng loạn hay gọi về nhà trước.',
    checklist:['Nhận diện đúng 2 tình huống lừa đảo','Đã có sẵn quỹ khẩn cấp','Tự xử lý được một sự cố nhỏ thật']}},
  veh1:{vi:{title:'Đặt Xe & Kiến Thức Cơ Bản Về Ô Tô',
    why:'Dù không có bằng lái, bạn vẫn sẽ dùng xe đặt qua ứng dụng và ô tô thường xuyên — hãy biết cách giữ an toàn và thông minh.',
    steps:['Xác minh tài xế/biển số trùng khớp trước khi lên xe.','Chia sẻ trạng thái chuyến đi với bạn bè/người thân.','Luôn có thói quen thắt dây an toàn, không có ngoại lệ.','Hiểu chi phí ước tính để lên ngân sách cho việc đi lại.'],
    example:"Hỏi 'tên tôi là gì?' trước khi lên xe giúp xác nhận bạn đang lên đúng xe, không phải xe giả mạo.",
    practice:'Đặt một chuyến xe thật hoặc thử nghiệm và thực hiện các bước xác minh thành tiếng.',
    challenge:'Tự thực hiện 3 chuyến đi bằng xe đặt qua ứng dụng, chia sẻ trạng thái chuyến đi mỗi lần.',
    checklist:['Thể hiện được thói quen xác minh','Đã thiết lập chia sẻ chuyến đi','Hoàn thành 3 chuyến đi độc lập']}},
  veh2:{vi:{title:'Phải Làm Gì Nếu Bạn Là Hành Khách Trong Tai Nạn',
    why:'Hiếm khi xảy ra, nhưng biết các bước sẽ loại bỏ sự hoảng loạn nếu điều đó thật sự xảy ra.',
    steps:['Kiểm tra bản thân và người khác xem có bị thương không trước tiên.','Di chuyển đến nơi an toàn nếu có thể; gọi 911 nếu cần.','Trao đổi thông tin nếu phù hợp và chụp ảnh hiện trường.','Gọi cho người tin cậy và theo dõi với trường/bảo hiểm nếu liên quan.'],
    example:'Chụp ảnh hiện trường trước khi mọi thứ bị di chuyển sẽ bảo vệ bạn sau này — luôn ghi lại trước tiên.',
    practice:'Nói to các bước xử lý tai nạn cho đến khi bạn có thể nhớ thuộc lòng.',
    challenge:'Dạy lại các bước này cho phụ huynh hoặc bạn bè mà không cần nhìn ghi chú.',
    checklist:['Đọc thuộc lòng các bước từ trí nhớ','Giải thích được bước chụp ảnh/ghi lại','Dạy lại quy trình cho người khác']}},
  cul1:{vi:{title:'Chuẩn Mực Trong Lớp Học & Xã Hội',
    why:'Việc phát biểu trong lớp, mối quan hệ thoải mái với giáo viên, và sự thẳng thắn khác với những gì bạn quen — hiểu chuẩn mực giúp tránh những bất ngờ khó xử.',
    steps:["Hiểu rằng việc tham gia phát biểu trong lớp thường được tính điểm — im lặng không phải lúc nào cũng là 'tôn trọng', mà có thể bị coi là thiếu tham gia.",'Học cách xưng hô phù hợp với giáo viên (thường gọi tên riêng trong một số môi trường).',"Hiểu về khoảng cách cá nhân và lời chào thông thường (đập tay, 'khỏe không').",'Học chuẩn mực trung thực học thuật — quy định trích dẫn và đạo văn rất nghiêm ngặt.'],
    example:'Giơ tay để tôn trọng phản biện ý kiến của giáo viên là điều bình thường và thường được đánh giá cao trong lớp học ở Mỹ.',

function t(key){ return (UI[state.lang] && UI[state.lang][key]) || UI.en[key] || key; }
function tr(dict, id, field){
  const d = dict[id];
  if(!d) return undefined;
  const langObj = (state.lang==='vi' && d.vi) ? d.vi : d.en;
  return langObj ? langObj[field] : undefined;
}
function catName(c){ return tr(CAT_I18N, c.id, 'name') || c.name; }
function lessonText(l, field){ return tr(LESSON_I18N, l.id, field) || l[field]; }
function lessonCatName(l){ const c = CATS.find(x=>x.id===l.catId); return c ? catName(c) : l.catName; }
function missionText(m, field){ return tr(MISSION_I18N, m.id, field) || m[field]; }
function badgeName(id){
  const d = BADGE_I18N[id];
  if(d) return (state.lang==='vi' && d.vi) ? d.vi.name : (SPECIAL_BADGES.find(b=>b.id===id)||{}).name;
  return (SPECIAL_BADGES.find(b=>b.id===id)||{}).name;
}
function catBadgeName(c){
  return state.lang==='vi' ? (catName(c) + t('masterSuffix')) : (c.name.split(' ')[0] + t('masterSuffix'));
}
function tierLabel(key){
  const map = {rookie:'tierRookie', apprentice:'tierApprentice', operator:'tierOperator', independent:'tierIndependent', master:'tierMaster'};
  return t(map[key] || 'tierRookie');
}

/* ============ PERSISTENCE (on-device only, this device's browser storage) ============ */
const STORAGE_KEY = 'rfi_state_v1';
function saveState(){
  try{
    const copy = Object.assign({}, state, {toast:null});
    localStorage.setItem(STORAGE_KEY, JSON.stringify(copy));
  }catch(e){ /* storage unavailable (e.g. private browsing) — app still works, just won't persist */ }
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const saved = JSON.parse(raw);
      state = Object.assign(state, saved);
    }
  }catch(e){}
}
function resetProgress(){
  if(confirm(t('resetConfirm'))){
    try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
    location.reload();
  }
}

}

function isIOS(){ return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream; }
function isStandalone(){ return window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches; }
function isFileProtocol(){ return location.protocol === 'file:'; }

try{ installTipDismissed = localStorage.getItem('rfi_install_tip_dismissed') === '1'; }catch(e){}

  installTipDismissed = true;
  try{ localStorage.setItem('rfi_install_tip_dismissed','1'); }catch(e){}

function InstallTip(){
  if(installTipDismissed || isStandalone()) return '';

    return `<div class="install-tip">📲 ${t('installTipIOS')} <b>&nbsp;${t('addToHomeScreen')}&nbsp;</b><button onclick="dismissInstallTip()">${t('gotIt')}</button></div>`;
  }

}

function independenceScore(s){
  const total = ALL_LESSONS.length;
  const done = Object.values(s.lessonStatus).filter(v=>v==='completed').length;
  return Math.round((done/total)*100);
}
function levelInfo(xp){
  const level = Math.floor(xp/100)+1;
  const into = xp%100;
  let tierKey='rookie';
  if(level>=18) tierKey='master';
  else if(level>=13) tierKey='independent';
  else if(level>=8) tierKey='operator';
  else if(level>=4) tierKey='apprentice';
  return {level, into, need:100, title:tierLabel(tierKey)};
}
function catProgress(cat){
  const total = cat.lessons.length;
  const done = cat.lessons.filter(l=>state.lessonStatus[l.id]==='completed').length;
  return {done, total, pct: Math.round((done/total)*100)};
}
function showToast(msg){
  state.toast = msg;
  render();
  setTimeout(()=>{ state.toast=null; render(); }, 2200);
}
function checkBadges(){
  SPECIAL_BADGES.forEach(b=>{
    if(!state.badgesEarned.includes(b.id) && b.test(state)){
      state.badgesEarned.push(b.id);
      showToast('🏅 '+(state.lang==='vi'?'Đã đạt huy hiệu: ':'Badge earned: ')+badgeName(b.id));
    }
  });
  CATS.forEach(c=>{
    const p = catProgress(c);
    const bid = 'cat_'+c.id;
    if(p.pct===100 && !state.badgesEarned.includes(bid)){
      state.badgesEarned.push(bid);
      showToast('🏅 '+(state.lang==='vi'?'Huy hiệu thành thạo: ':'Mastery badge: ')+catName(c));
    }
  });
}

function nav(screen){ state.screen=screen; state.activeCat=null; state.activeLesson=null; render(); window.scrollTo?.(0,0); }
function openCat(id){ state.activeCat=id; state.screen='catDetail'; render(); }
function openLesson(id){ state.activeLesson=id; state.screen='lessonDetail'; if(!state.checklistState[id]) state.checklistState[id]=[]; render(); }
function toggleParent(){ state.parentMode=!state.parentMode; state.screen='home'; render(); }
function toggleChk(lid, idx){
  const arr = state.checklistState[lid];
  const i = arr.indexOf(idx);
  if(i>-1) arr.splice(i,1); else arr.push(idx);
  render();
}
function submitLesson(lid){
  state.lessonStatus[lid] = 'pending';
  if(!state.pendingParentTasks.includes(lid)) state.pendingParentTasks.push(lid);
  showToast(state.lang==='vi' ? 'Đã gửi để phụ huynh xác nhận ✔' : 'Submitted for parent verification ✔');
  render();
}
function parentApprove(lid, approve){
  state.pendingParentTasks = state.pendingParentTasks.filter(x=>x!==lid);
  if(approve){
    state.lessonStatus[lid] = 'completed';
    const lesson = ALL_LESSONS.find(l=>l.id===lid);
    state.totalXP += lesson.xp;
    state.activeMissions.forEach(m=>{ if(m.cat===lesson.catId) m.progress=Math.min(m.target,m.progress+1); });
    checkBadges();
    showToast(state.lang==='vi' ? ('Đã duyệt — nhận +'+lesson.xp+' XP!') : ('Approved — +'+lesson.xp+' XP awarded!'));
  } else {
    state.lessonStatus[lid] = 'available';
    showToast(state.lang==='vi' ? 'Đã gửi lại để thử lại' : 'Sent back for another try');
  }
  render();
}
function assignChallenge(catId, lessonId, note){
  showToast(state.lang==='vi' ? ('Đã giao thử thách cho '+state.teenName+' ✔') : ('Challenge assigned to '+state.teenName+' ✔'));
}
function addMilestone(title, date){
  state.milestones.push({id:'ms'+Date.now(), title, date, done:false});
  render();
}
function toggleMilestone(id){
  const m = state.milestones.find(x=>x.id===id);
  if(m) m.done = !m.done;
  render();
}
function sendChat(text){
  if(!text.trim()) return;
  state.chat.push({who:'me', text});
  const reply = coachReply(text);
  state.chat.push({who:'coach', text:reply});
  render();
  setTimeout(()=>{ const sc=document.getElementById('chatScroll'); if(sc) sc.scrollTop=sc.scrollHeight; },30);
}
function coachReply(text){
  const lc = text.toLowerCase();

  if(/budget|money|save|tiền|ngân sách|tiết kiệm/.test(lc)) return vi
    ? "Bắt đầu với công thức 50/30/20: 50% nhu cầu, 30% mong muốn, 20% tiết kiệm. Xem bài học Ngân Sách trong Học viện — nhiệm vụ đầu tiên sẽ giúp bạn lập ngân sách thật."
    : "Start with the 50/30/20 split: 50% needs, 30% wants, 20% savings. Check the Budgeting lesson in the Academy — the first task builds your real budget.";
  if(/laundry|giặt/.test(lc)) return vi
    ? "Quy tắc giặt đồ số 1: tách riêng màu và kiểm tra nhãn trước khi giặt bất kỳ đồ mới nào tối màu hoặc sáng màu. Vào mục Giặt Ủi & Chăm Sóc Quần Áo để xem từng bước."
    : "Laundry rule #1: separate colors and check the tag before washing anything new and dark or bright. Head to Laundry & Clothing Care to run through it step by step.";
  if(/cook|food|meal|nấu|món ăn|ăn uống/.test(lc)) return vi
    ? "Thành thạo 5 món ăn tủ và bạn sẽ không bao giờ bị bí. Trứng, xào, mì Ý, nướng khay, và súp/bát ngũ cốc đủ dùng cho hầu hết các tuần. Xem mục Nấu Ăn Cơ Bản."
    : "Master 5 go-to meals and you'll never be stuck. Eggs, stir fry, pasta, sheet-pan bake, and a soup/bowl covers most weeks. Check Cooking Basic Meals.";
  if(/nervous|scared|worried|anxious|lo lắng|sợ|hồi hộp/.test(lc)) return vi
    ? "Hoàn toàn bình thường — ai cũng cảm thấy vậy trước một thay đổi lớn. Chọn một kỹ năng nhỏ để làm chủ trong tuần này thay vì nghĩ về tất cả cùng lúc. Có điều gì bạn có thể luyện tập ngay hôm nay không?"
    : "Totally normal — everyone feels that before a big change. Pick one small skill to nail this week instead of thinking about all of it at once. What's one thing you could practice today?";
  if(/friend|social|lonely|bạn bè|cô đơn|kết bạn/.test(lc)) return vi
    ? "Cách nhanh nhất để kết bạn ở nước ngoài: tham gia một câu lạc bộ trong tháng đầu tiên và xuất hiện 3 lần, dù có cảm thấy hơi ngại lúc đầu. Xem mục Kỹ Năng Giao Tiếp Xã Hội để có những câu mở đầu thực sự hiệu quả."
    : "Fastest way to build friends abroad: join one club in your first month and show up 3 times, even if it feels awkward at first. Check Social & Communication Skills for openers that actually work.";
  if(/score|independence|điểm|độc lập/.test(lc)) return vi
    ? ('Điểm Độc Lập của bạn hiện tại là '+independenceScore(state)+'%. Điểm này thay đổi mỗi khi một nhiệm vụ được phụ huynh xác nhận hoàn thành. Bạn có muốn gợi ý về việc tiếp theo nên làm không?')
    : ('Your Independence Score right now is '+independenceScore(state)+'%. It moves whenever a parent-verified task gets completed. Want a suggestion for what to tackle next?');
  if(/next|what should i|suggest|tiếp theo|nên học/.test(lc)) return suggestNext();
  if(/streak|chuỗi ngày/.test(lc)) return vi
    ? ('Chuỗi ngày hiện tại của bạn là '+state.streak+' ngày. Hãy tiếp tục xuất hiện mỗi ngày — chỉ cần vào ứng dụng 2 phút cũng đủ giữ chuỗi ngày.')
    : ('Your current streak is '+state.streak+' days. Keep showing up daily — even a 2-minute check-in on the app keeps it alive.');
  if(/badge|huy hiệu/.test(lc)) return vi
    ? ('Bạn đã đạt được '+state.badgesEarned.length+' huy hiệu cho đến nay. Huy hiệu thành thạo nhóm kỹ năng sẽ mở khóa khi bạn hoàn thành cả 2 bài học trong một nhóm — xem tab Hồ sơ của bạn.')
    : ("You've earned "+state.badgesEarned.length+' badges so far. Category mastery badges unlock when you finish both lessons in a category — check your Profile tab.');
  return vi
    ? "Câu hỏi hay đó. Cho mình biết một lĩnh vực kỹ năng — giặt đồ, nấu ăn, ngân sách, giao thông, xã hội, hoặc an toàn — và mình sẽ giải thích đơn giản cho bạn. Hoặc hỏi 'con nên học gì tiếp theo?' và mình sẽ gợi ý."
    : "Good question. Tell me a skill area — laundry, cooking, budgeting, transit, social, or safety — and I'll break it down simply. Or ask 'what should I learn next?' and I'll suggest something.";
}
function suggestNext(){
  const notDone = ALL_LESSONS.filter(l=>state.lessonStatus[l.id]!=='completed');
  const vi = state.lang==='vi';
  if(notDone.length===0) return vi
    ? "Bạn đã hoàn thành mọi thứ trong Học viện — thực sự ấn tượng. Đã đến lúc đào sâu hơn vào các thử thách thực hành thực tế."
    : "You've completed everything in the Academy — seriously impressive. Time to go deeper on real-world practice challenges.";
  const pick = notDone[0];
  const catN = lessonCatName(pick);
  const title = lessonText(pick,'title');
  const year = CATS.find(c=>c.id===pick.catId).year;
  return vi
    ? ('Bạn nên học "'+title+'" trong mục '+catN+' tiếp theo — được '+pick.xp+' XP và giúp bạn tiến gần hơn tới mục tiêu Năm '+year+'.')
    : ('I\'d suggest "'+title+'" in '+catN+' next — it\'s worth '+pick.xp+' XP and builds directly toward your Year '+year+' goals.');
}

    <div class="formfield">
      <label>${t('profileNameLabel')}</label>
      <input id="nameInput" type="text" value="${esc(state.teenName)}" placeholder="${t('enterNamePlaceholder')}" />
    </div>
    <button class="btn btn-outline" onclick="const i=document.getElementById('nameInput'); if(i.value.trim()){ setTeenName(i.value.trim()); }">${t('saveNameBtn')}</button>
    <div style="font-size:11px;color:var(--ink-soft);margin-top:8px;line-height:1.4;">${t('switchKidNote')}</div>
  </div>
  <button class="btn btn-danger-o" onclick="resetProgress()">${t('resetAllProgress')}</button>
  `;
}

function Roadmap(){
  return `<div class="card"><div class="timeline">
    ${ROADMAP_I18N.map((i,idx)=>{const d=(state.lang==='vi'&&i.vi)?i.vi:i.en; const st=idx===0?'now':'future'; return `<div class="tl-item"><div class="tl-dot ${st}"></div><div class="when">${d.when}</div><div class="what">${d.what}</div><div class="detail">${d.detail}</div></div>`;}).join('')}
  </div></div>`;
}

function ScreenParent(){
  const score = independenceScore(state);
  const sorted = [...CATS].sort((a,b)=>catProgress(b).pct-catProgress(a).pct);
  const strengths = sorted.slice(0,3);
  const gaps = [...sorted].reverse().slice(0,3);
  const pending = state.pendingParentTasks.map(id=>ALL_LESSONS.find(l=>l.id===id)).filter(Boolean);
  return `
  <h2 class="font-display" style="margin:2px 0 4px;">${t('parentDashboardTitle')}</h2>
  <div style="font-size:12px;color:var(--ink-soft);margin-bottom:14px;">${state.lang==='vi'?`Đang theo dõi hành trình sẵn sàng của ${esc(state.teenName)}`:`Monitoring ${esc(state.teenName)}'s readiness journey`}</div>

  <div class="card" style="background:var(--navy);color:#fff;">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <div><div style="font-size:12px;color:rgba(255,255,255,.65);">${t('independenceScoreShort')}</div><div style="font-size:30px;font-weight:800;font-family:'Sora',sans-serif;">${score}%</div></div>
      <div style="text-align:right;"><div style="font-size:12px;color:rgba(255,255,255,.65);">${t('streakShort')}</div><div style="font-size:22px;font-weight:800;">🔥 ${state.streak}${state.lang==='vi'?' ngày':'d'}</div></div>
    </div>
  </div>

  <div class="section-title">⏳ ${state.lang==='vi'?'Đang Chờ Xác Nhận':'Pending Verification'} (${pending.length})</div>
  <div class="card">
    ${pending.length===0? `<div class="empty">${t('allCaughtUp')}</div>` :
      pending.map(l=>`<div class="verify-row">
        <div><div class="vt">${esc(lessonText(l,'title'))}</div><div class="vs">${esc(lessonCatName(l))} · +${l.xp} XP</div></div>
        <div class="vbtns">
          <button class="iconbtn ok" onclick="parentApprove('${l.id}',true)">✓</button>
          <button class="iconbtn no" onclick="parentApprove('${l.id}',false)">✕</button>
        </div>
      </div>`).join('')}
  </div>

  <div class="section-title">${t('strengthsGaps')}</div>
  <div class="card">
    <div style="font-weight:800;font-size:12.5px;color:var(--teal);margin-bottom:6px;">${t('topStrengths')}</div>
    ${strengths.map(c=>{const p=catProgress(c); return `<div class="pbar-row"><div class="lbl"><span>${c.icon} ${esc(catName(c))}</span><span>${p.pct}%</span></div><div class="ptrack"><div class="pfill" style="width:${p.pct}%;background:var(--teal);"></div></div></div>`;}).join('')}
    <div style="font-weight:800;font-size:12.5px;color:var(--coral);margin:14px 0 6px;">${t('needsAttention')}</div>
    ${gaps.map(c=>{const p=catProgress(c); return `<div class="pbar-row"><div class="lbl"><span>${c.icon} ${esc(catName(c))}</span><span>${p.pct}%</span></div><div class="ptrack"><div class="pfill" style="width:${p.pct}%;background:var(--coral);"></div></div></div>`;}).join('')}
  </div>

  <div class="section-title">${t('assignChallengeTitle')}</div>
  <div class="card">
    <div class="formfield">
      <label>${t('categoryLabel')}</label>
      <select id="assignCat">${CATS.map(c=>`<option value="${c.id}">${c.icon} ${esc(catName(c))}</option>`).join('')}</select>
    </div>
    <div class="formfield">
      <label>${t('noteOptional')}</label>
      <textarea id="assignNote" rows="2" placeholder="${t('notePlaceholder')}"></textarea>
    </div>
    <button class="btn btn-primary" onclick="const cat=document.getElementById('assignCat').value; const note=document.getElementById('assignNote').value; assignChallenge(cat,null,note);">${t('assignChallengeBtn')}</button>
  </div>

  <div class="section-title">${t('milestonesTitle')}</div>
  <div class="card">
    ${state.milestones.map(m=>`
      <div class="chk-item ${m.done?'done':''}" onclick="toggleMilestone('${m.id}')">
        <div class="chk-box ${m.done?'done':''}">${m.done?'✓':''}</div>
        <div class="t">${esc(m.title)} <span style="color:var(--ink-soft);font-weight:600;">— ${t('targetWord')} ${m.date}</span></div>
      </div>`).join('')}
    <div style="display:flex;gap:8px;margin-top:12px;">
      <input id="msTitle" placeholder="${t('newMilestonePlaceholder')}" style="flex:1;border:1.5px solid var(--line);border-radius:8px;padding:9px 11px;font-size:12.5px;font-family:inherit;">
      <input id="msDate" type="date" style="border:1.5px solid var(--line);border-radius:8px;padding:9px 11px;font-size:12.5px;font-family:inherit;">
      <button class="btn btn-primary btn-sm" onclick="const t=document.getElementById('msTitle'); const d=document.getElementById('msDate'); if(t.value){addMilestone(t.value, d.value||'TBD'); t.value='';}">${t('addBtn')}</button>
    </div>
  </div>

  <div class="section-title">${t('fullCategoryOverview')}</div>
  <div class="card">
    ${CATS.map(c=>{const p=catProgress(c); return `<div class="pbar-row"><div class="lbl"><span>${c.icon} ${esc(catName(c))} <span style="color:var(--ink-soft);font-weight:600;">(Y${c.year})</span></span><span>${p.done}/${p.total}</span></div><div class="ptrack"><div class="pfill" style="width:${p.pct}%;background:${c.color};"></div></div></div>`;}).join('')}
  </div>
  `;
}

/* ============ MAIN RENDER ============ */
function render(){
  let body;
  if(state.parentMode){
    body = ScreenParent();
  } else {
    switch(state.screen){
      case 'home': body = ScreenHome(); break;
      case 'academy': body = ScreenAcademy(); break;
      case 'catDetail': body = ScreenCatDetail(); break;
      case 'lessonDetail': body = ScreenLessonDetail(); break;
      case 'missions': body = ScreenMissions(); break;
      case 'coach': body = ScreenCoach(); break;
      case 'profile': body = ScreenProfile(); break;
      default: body = ScreenHome();
    }
  }
  document.getElementById('root').innerHTML = `
    <div class="app-shell">
      ${TopBar()}
      ${InstallTip()}
      <div class="screen">${body}</div>
      ${BottomNav()}
      ${state.toast? `<div class="toast">${esc(state.toast)}</div>` : ''}
    </div>
  `;
  if(state.screen==='coach'){ const sc=document.getElementById('chatScroll'); if(sc) sc.scrollTop = sc.scrollHeight; }
  document.documentElement.lang = state.lang;
  document.title = t('appTitle');
  saveState();
}
render();
</script>
</body>
</html>
